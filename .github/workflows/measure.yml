name: Measure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'ch-test-deploy' || github.run_id }}
  cancel-in-progress: false

jobs:
  site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # docs/site version resolution requires tags
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Resolve docs version
        run: bash scripts/resolve_docs_version.sh
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - name: Create .nojekyll sentinel
        run: touch site/dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/

  tests:
    needs: site-build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14"]
        split: [1, 2, 3]
        include:
          - os: ubuntu-latest
            job_timeout_minutes: 30
            pytest_timeout_minutes: 13
            pytest_timeout_seconds: 300
          - os: macos-latest
            job_timeout_minutes: 30
            pytest_timeout_minutes: 13
            pytest_timeout_seconds: 300
          # Windows CI polling monitor occasionally misses second file write within
          # 45s window — retry individual flaky tests before failing the run.
          - os: windows-latest
            job_timeout_minutes: 60
            pytest_timeout_minutes: 20
            pytest_timeout_seconds: 600
            pytest_extra_args: "--reruns 2 --reruns-delay 5 --only-rerun AssertionError"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout_minutes || 30 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # docs/site version resolution requires tags

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Resolve docs version
        run: bash scripts/resolve_docs_version.sh

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site

      - name: Install dependencies
        run: uv sync --locked

      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist

      - name: Build Rust extension
        uses: ./.github/actions/build-rust-extension

      - name: Test collection check
        run: uv run pytest tests/ --collect-only -q --tb=no

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          CHUNKHOUND_USE_EXISTING_SITE_DIST: "1"
        # Two retry layers serving different failure modes:
        # - nick-fields/retry: restarts the whole pytest process on CI-level failures
        #   (e.g. OOM, runner hiccup).
        # - --reruns (pytest-rerunfailures): retries individual flaky tests within a
        #   process, used on Windows where the file-monitor can miss writes transiently.
        # timeout_minutes * max_attempts must stay below the job-level timeout.
        # continue-on-error: a persistent failure doesn't fail the job by itself — the
        # "Check flaky annotations" step below is the real gate, so the job stays green
        # when every failure is annotated '# flaky: reason'.
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        with:
          timeout_minutes: ${{ matrix.pytest_timeout_minutes || 13 }}
          max_attempts: 2
          command: uv run pytest tests/ -v --junit-xml=test-results.xml --splits 3 --group ${{ matrix.split }} ${{ matrix.pytest_extra_args || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}-split${{ matrix.split }}
          path: test-results.xml
          if-no-files-found: ignore

      - name: Check flaky annotations
        if: steps.tests.outcome == 'failure'
        run: uv run python scripts/check_flaky_annotations.py test-results.xml
